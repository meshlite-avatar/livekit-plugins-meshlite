name: pipecat-meshlite (review only)

# Runs the pipecat-meshlite CI (pipecat-meshlite/.github/workflows/ci.yml) on PR #3, so the
# review sees it green. The folder becomes its own repository by subtree split, which
# leaves this file behind; PR #3 is not merged, so this file never reaches main.
on:
  pull_request:
    paths: ["pipecat-meshlite/**", ".github/workflows/pipecat-meshlite-review.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: pipecat-meshlite

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.11", pipecat: "pipecat-ai[webrtc,silero,azure,runner]==1.15.0" }
          - { python-version: "3.12", pipecat: "pipecat-ai[webrtc,silero,azure,runner]" }
          - { python-version: "3.13", pipecat: "pipecat-ai[webrtc,silero,azure,runner]" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,example]" "${{ matrix.pipecat }}" ruff
      - run: ruff check . && ruff format --check src tests
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python scripts/check_dist.py dist
